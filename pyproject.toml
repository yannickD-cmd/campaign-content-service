[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campaign-content-service"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "pip-tools>=7.6",
    "pre-commit>=4.7",
]